[package]
name = "blindkey-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Blindkey — a simple, fast, secure desktop app (egui shell over blindkey-core)."
publish = false

# A thin UC-18 shell: all secret-touching logic stays in `blindkey-core`; this binary only renders
# metadata, orchestrates clipboard delivery (model-blind), and persists via the core's save path.
[[bin]]
name = "blindkey-gui"
path = "src/main.rs"

[features]
default = ["volume-mount"]
# Prefer userspace FUSE when available (Linux always; macOS only with `macos-fuse` + macFUSE).
# Without a working FUSE session the GUI falls back to MaterializedMount (ADR-0010).
volume-mount = ["dep:blindkey-fuse"]
# Optional: link against user-installed macFUSE (https://macfuse.io). Build requires fuse.pc.
# Does not embed or redistribute macFUSE/Fuse-T (ADR-0010).
macos-fuse = ["volume-mount", "blindkey-fuse/macos-fuse"]

[dependencies]
blindkey-core = { path = "../blindkey-core", version = "1.0.0" }
blindkey-hardware = { path = "../blindkey-hardware", version = "1.0.0" }
blindkey-clip = { path = "../blindkey-clip", version = "1.0.0" }
blindkey-sys = { path = "../blindkey-sys", version = "1.0.0" }
blindkey-fuse = { path = "../blindkey-fuse", version = "1.0.0", optional = true }
eframe = { workspace = true }   # UC-20: glow pinned in workspace; no persistence (C41)
rfd = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }   # entry-id randomness (same audited OS CSPRNG blindkey-core uses)
