[package]
name = "blindkey-fuse"
description = "Blindkey — FUSE mount adapter for UC-25 local encrypted volumes (.vltd). Maps a userspace FUSE session onto an unlocked blindkey-core Volume; contains no cryptography (ADR-0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Optional macOS live mount against a *user-installed* macFUSE (https://macfuse.io).
# Requires libfuse headers at build time (`fuse.pc` / `osxfuse.pc`). Does **not** embed or
# redistribute Fuse-T / macFUSE (ADR-0010 commercial-license gate).
macos-fuse = ["dep:fuser", "dep:libc"]

[dependencies]
blindkey-core = { path = "../blindkey-core", version = "1.1.0" }

# Linux: pure-Rust fusermount path (no system libfuse required to *build*).
[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true
libc.workspace = true

# macOS: always link blindkey-sys for runtime macFUSE detection; fuser only with `macos-fuse`.
[target.'cfg(target_os = "macos")'.dependencies]
blindkey-sys = { path = "../blindkey-sys", version = "1.1.0" }
fuser = { version = "0.15", optional = true, default-features = false, features = ["libfuse", "macfuse-4-compat"] }
libc = { workspace = true, optional = true }
