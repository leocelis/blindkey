[package]
name = "blindkey-cli"
description = "Blindkey — the local-first credential vault your AI agents can use but never see. The `blindkey` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Installed as `cargo install blindkey-cli`; the binary is named `vault` (constraint C20, C21).
[[bin]]
name = "blindkey"
path = "src/main.rs"

[features]
# Off by default so `cargo build`/CI without FUSE still compile (ADR-0009). Turn on for desktop
# builds to enable `blindkey volume mount|umount` via the blindkey-fuse adapter.
default = []
volume-mount = ["dep:blindkey-fuse"]
# Optional macOS FUSE against user-installed macFUSE (https://macfuse.io). See ADR-0010.
macos-fuse = ["volume-mount", "blindkey-fuse/macos-fuse"]

[dependencies]
blindkey-core = { path = "../blindkey-core", version = "1.0.0" }
# UC-25 live mount adapter — only pulled in under the `volume-mount` feature (ADR-0009).
blindkey-fuse = { path = "../blindkey-fuse", version = "1.0.0", optional = true }
blindkey-sys = { path = "../blindkey-sys", version = "1.0.0" }
# The YubiKey 2FA path shells out to `ykman` (std subprocess), so this is a cheap, always-on dep.
blindkey-hardware = { path = "../blindkey-hardware", version = "1.0.0" }
blindkey-clip = { path = "../blindkey-clip", version = "1.0.0" }
blindkey-agent = { path = "../blindkey-agent", version = "1.0.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
rpassword.workspace = true
zeroize.workspace = true
secrecy.workspace = true
