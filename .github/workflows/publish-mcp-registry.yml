name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# GitHub OIDC proves ownership of the io.github.leocelis namespace; no secret is stored.
# Before running: build the bundle with scripts/build-mcpb.sh, attach it to the release, and
# put its version, URL and SHA-256 in server.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for the MCP Registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the bundle matches server.json
        run: |
          set -euo pipefail
          url=$(jq -r '.packages[0].identifier' server.json)
          want=$(jq -r '.packages[0].fileSha256' server.json)
          curl -fsSL -o bundle.mcpb "$url"
          got=$(sha256sum bundle.mcpb | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "FAIL: $url sha256 $got != server.json $want"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish
